services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sahay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahay_secure_local_dev_secret}
      POSTGRES_DB: sahay_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahay -d sahay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sahay_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahay_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+psycopg://sahay:${POSTGRES_PASSWORD:-sahay_secure_local_dev_secret}@db:5432/sahay_db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000
      - ENVIRONMENT=development
      - DEBUG=True
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-sahay_docker_composed_secure_jwt_key_32_chars_min}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahay_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
