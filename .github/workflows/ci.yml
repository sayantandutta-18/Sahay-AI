name: Sahay AI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          SECRET_KEY: "ci-test-secret-key-for-sahay-jwt-signing"
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          AI_MODE: "demo"
          DATA_ENCRYPTION_KEY: "c2FoYXktY2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmI="
        run: |
          python -m pytest backend/tests -v

  frontend-checks-and-build:
    name: Frontend Audits & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run i18n Localization Parity Audit
        run: npm run test:i18n

      - name: Run Accessibility (WCAG 2.1 AA) Audit
        run: npm run test:a11y

      - name: Run Verification Badge Logic Tests
        run: npm run test:verification

      - name: Run Readiness Radar Logic Tests
        run: npm run test:readiness

      - name: Run Comparison Matrix Logic Tests
        run: npm run test:comparison

      - name: Run Multilingual Search Tests
        run: npm run test:search

      - name: Run State Directory & Map Tests
        run: npm run test:state-map

      - name: Run Glossary & Onboarding Tour Tests
        run: npm run test:tour

      - name: Run AI Demo / Live Mode & Fallback Tests
        run: npm run test:ai-mode

      - name: Build Production Next.js Bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://sahay-ai-5.onrender.com"
        run: npm run build
